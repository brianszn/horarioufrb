<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1220">
    <title>Tradutor de Horários - UFRB</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" type="imagex/png" href="https://www.ufrb.edu.br/ascom/images/marca2017/marca-vertical-UFRB-PNG.png">
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.9.0/brython.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="text/javascript" src="controller.js"></script>
</head>

<body>
    <div class="app">
        <div class="app_header">
            <h1>Horários UFRB</h1>
            <p class="app_subtitle">Adicione matérias, visualize na grade e evite choques.</p>
        </div>

        <div class="card controls" aria-label="Controles de matérias">
            <div class="inputs">
                <label class="field">
                    <span class="field_label">Matéria</span>
                    <input type="text" id="input_nome" placeholder="Ex: Cálculo I" autocomplete="off" />
                </label>

                <label class="field">
                    <span class="field_label">Código do horário</span>
                    <input type="text" id="input_codigo" placeholder="Ex: 2M123 4T12" autocomplete="off" />
                </label>

                <div class="actions">
                    <button id="btn_add" type="button">Adicionar</button>
                    <button id="btn_pdf" type="button" class="pdf-btn">Baixar PDF</button>
                    <button id="btn_clear" type="button" class="secondary">Limpar</button>
                </div>
            </div>

            <p id="message" class="message" role="status" aria-live="polite"></p>

            <div id="subjects" class="subjects" aria-label="Matérias adicionadas"></div>
        </div>

        <div class="card" aria-label="Grade de horários">
            <div class="tableContainer">
                <table id="table">
                    <colgroup>
                        <col class="col-hours" />
                        <col class="col-day" span="6" />
                    </colgroup>
                    <tr class="headerTable">
                        <th>Horários</th>
                        <th>Seg</th>
                        <th>Ter</th>
                        <th>Qua</th>
                        <th>Qui</th>
                        <th>Sex</th>
                        <th>Sab</th>
                    </tr>
                </table>
            </div>
        </div>

        <div class="app_footer">Feito por <strong>grupinho do zap</strong> <span class="muted">“Eng. Computação ALUNOS”</span></div>
    </div>
</body>
</html>
